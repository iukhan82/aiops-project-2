# Applies only to the mTLS listener (8883); use_identity_as_username there
# sets %u to the connecting client certificate's CN (the device_id). Default
# is deny: a device may only publish/subscribe under its own topic tree.
# P05.02 acceptance: cross-device access must fail - this is the mechanism.
#
# Note (verified empirically, see source-code/infra/README.md): mosquitto's
# classic acl_file backend grants the MQTT SUBACK return code optimistically
# for any topic filter - the actual read restriction is enforced at message
# delivery time, not at SUBACK time. A denied subscriber's SUBACK still
# shows "granted"; it simply never receives a matching message. Verification
# must check delivery, not the SUBACK code.

pattern readwrite devices/%u/#

# P05.03: the gateway is the only client allowed to read every device's
# telemetry and write every device's application-level ack (ADR-0002: "no
# service consumes MQTT directly except the gateway"). Rules are additive
# with the pattern above, not first-match, so this only ever *adds* scope.
user gateway
topic read devices/+/telemetry
topic write devices/+/ack
