# Development/test-fixture MQTT listener only (ADR-0002).
#
# Plain, unauthenticated MQTT on 1883 is permitted here because this compose
# stack IS the "isolated test fixture" ADR-0002 and docs/environment/
# TOPOLOGY.md carve out - it is not the production/K3s target. P05.02 adds a
# second listener on 8883 with mTLS, per-device client certificates and topic
# ACLs; nothing beyond this local/dev fixture may use the plain listener.

# Security options (allow_anonymous, acl_file, use_identity_as_username, ...)
# are otherwise shared globally across listeners; per_listener_settings makes
# each listener's block authoritative for its own connections only.
per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous true

# Secured device uplink (P05.02, ADR-0002). Client cert is required and its
# CN becomes the MQTT username (use_identity_as_username), which acl.conf's
# %u pattern then scopes to that device's own topic tree only. A client
# whose cert is not signed by ca.crt fails the TLS handshake before any MQTT
# CONNECT is possible - this is the "bad trust fails" acceptance mechanism.
listener 8883
protocol mqtt
allow_anonymous false
require_certificate true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
use_identity_as_username true
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice
