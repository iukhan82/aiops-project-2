# GENERATED by build_rule_tests.py from rules/aiops-alerts.yml - do not edit; run `promtool test rules` on it (backend/aiops/verify_alerts.py does).
rule_files:
- ../rules/aiops-alerts.yml
evaluation_interval: 15s
tests:
- interval: 15s
  input_series:
  - series: up{job="x"}
    values: 1x4
  alert_rule_test:
  - eval_time: 1m
    alertname: AlertPipelineWatchdog
    exp_alerts:
    - exp_labels:
        severity: none
        alert_class: pipeline
      exp_annotations:
        summary: 'Dead-man''s switch: this alert must always be firing.'
        description: If this stops firing, rule evaluation or alert delivery is broken and no other alert can be trusted.
        action: Check Prometheus rule evaluation and the alert receiver.
- interval: 15s
  input_series:
  - series: platform_probe_success_timestamp_seconds
    values: '0x40'
  alert_rule_test:
  - eval_time: 4m
    alertname: PlatformProbeStale
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: pipeline
      exp_annotations:
        summary: The platform probe has not reported for over 90 s.
        description: Device, storage, certificate and configuration alerts read the probe's gauges; while it is silent they are blind.
        action: Restart aiops-platform-probe; check its database and OTLP connectivity.
- interval: 15s
  input_series:
  - series: platform_probe_success_timestamp_seconds
    values: 0+15x40
  alert_rule_test:
  - eval_time: 4m
    alertname: PlatformProbeStale
    exp_alerts: []
- interval: 15s
  input_series:
  - series: up{job="x"}
    values: 1x40
  alert_rule_test:
  - eval_time: 6m
    alertname: PlatformProbeMissing
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: pipeline
      exp_annotations:
        summary: No platform probe has ever reported (or its series expired).
        description: Without the probe the device, storage, certificate and configuration alerts cannot fire.
        action: Start the platform probe.
- interval: 15s
  input_series:
  - series: platform_probe_success_timestamp_seconds
    values: 0+15x40
  alert_rule_test:
  - eval_time: 6m
    alertname: PlatformProbeMissing
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_probe_target_up{service_name="postgres"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: PlatformTargetDown
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: pipeline
        service_name: postgres
      exp_annotations:
        summary: postgres did not answer the platform probe.
        description: The probe could not read postgres (database, policy engine or API).
        action: Check the postgres container and its health endpoint.
- interval: 15s
  input_series:
  - series: platform_probe_target_up{service_name="postgres"}
    values: 1x20
  alert_rule_test:
  - eval_time: 3m
    alertname: PlatformTargetDown
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_devices_active{device_type="traffic_loop"}
    values: 100x40
  - series: platform_devices_stale{device_type="traffic_loop"}
    values: 30x40
  - series: platform_devices_never_reported{device_type="traffic_loop"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 4m
    alertname: DevicesSilent
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: device
        device_type: traffic_loop
      exp_annotations:
        summary: Over 25% of traffic_loop devices are stale or have never reported.
        description: Staleness uses the same per-type budgets as the device-health screen (routes_govern.DEVICE_STALE_AFTER_S).
        action: Open Device health; check the gateway and the device's power/network.
- interval: 15s
  input_series:
  - series: platform_devices_active{device_type="traffic_loop"}
    values: 100x40
  - series: platform_devices_stale{device_type="traffic_loop"}
    values: 5x40
  - series: platform_devices_never_reported{device_type="traffic_loop"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 4m
    alertname: DevicesSilent
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_devices_active{device_type="traffic_loop"}
    values: 100x40
  - series: platform_devices_stale{device_type="traffic_loop"}
    values: 40x40
  - series: platform_devices_never_reported{device_type="traffic_loop"}
    values: 20x40
  alert_rule_test:
  - eval_time: 4m
    alertname: DeviceTypeOutage
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: device
        device_type: traffic_loop
      exp_annotations:
        summary: Half or more of traffic_loop devices are silent.
        description: A whole device class has stopped reporting; detectors that depend on it are blind.
        action: Treat as a stream or site outage; escalate to the on-call owner.
- interval: 15s
  input_series:
  - series: platform_devices_active{device_type="traffic_loop"}
    values: 100x40
  - series: platform_devices_stale{device_type="traffic_loop"}
    values: 30x40
  - series: platform_devices_never_reported{device_type="traffic_loop"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 4m
    alertname: DeviceTypeOutage
    exp_alerts: []
- interval: 15s
  input_series:
  - series: gateway_events_received_total
    values: 0+30x60
  - series: gateway_events_delivered_total
    values: 0+3x60
  alert_rule_test:
  - eval_time: 8m
    alertname: GatewayDeliveryStalled
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: stream
      exp_annotations:
        summary: The gateway is receiving events but delivering under half of them.
        description: MQTT-to-Kafka delivery has stalled; the durable outbox is buffering.
        action: Check Kafka broker health and the gateway's outbox depth.
- interval: 15s
  input_series:
  - series: gateway_events_received_total
    values: 0+30x60
  - series: gateway_events_delivered_total
    values: 0+30x60
  alert_rule_test:
  - eval_time: 8m
    alertname: GatewayDeliveryStalled
    exp_alerts: []
- interval: 15s
  input_series:
  - series: ingestion_events_inserted_total
    values: 0+90x80
  - series: ingestion_events_rejected_schema_total
    values: 0+10x80
  alert_rule_test:
  - eval_time: 8m
    alertname: IngestionRejectionRateHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: stream
        slo: ingestion-rejection-rate
      exp_annotations:
        summary: More than 5% of ingested events are being rejected.
        description: Schema, unknown-device or content-conflict rejections exceed the ingestion-rejection-rate SLO.
        action: Read the ingestion rejection audit for the dominant reason (schema drift, unregistered device, replay conflict).
- interval: 15s
  input_series:
  - series: ingestion_events_inserted_total
    values: 0+90x80
  - series: ingestion_events_rejected_schema_total
    values: 0+1x80
  alert_rule_test:
  - eval_time: 8m
    alertname: IngestionRejectionRateHigh
    exp_alerts: []
- interval: 15s
  input_series:
  - series: ingestion_ingest_latency_milliseconds_bucket{le="1000"}
    values: 0+10x80
  - series: ingestion_ingest_latency_milliseconds_bucket{le="2000"}
    values: 0+12x80
  - series: ingestion_ingest_latency_milliseconds_bucket{le="5000"}
    values: 0+20x80
  - series: ingestion_ingest_latency_milliseconds_bucket{le="+Inf"}
    values: 0+20x80
  alert_rule_test:
  - eval_time: 8m
    alertname: IngestionLatencyP95High
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: stream
        slo: ingestion-ingest-latency-p95
      exp_annotations:
        summary: P95 observation-to-database latency is above 2 s.
        description: LAT-02 is being missed.
        action: Check consumer lag and Postgres write latency.
- interval: 15s
  input_series:
  - series: ingestion_ingest_latency_milliseconds_bucket{le="1000"}
    values: 0+20x80
  - series: ingestion_ingest_latency_milliseconds_bucket{le="2000"}
    values: 0+20x80
  - series: ingestion_ingest_latency_milliseconds_bucket{le="5000"}
    values: 0+20x80
  - series: ingestion_ingest_latency_milliseconds_bucket{le="+Inf"}
    values: 0+20x80
  alert_rule_test:
  - eval_time: 8m
    alertname: IngestionLatencyP95High
    exp_alerts: []
- interval: 15s
  input_series:
  - series: network_state_records_total{freshness_status="fresh"}
    values: 0+2x80
  - series: network_state_records_total{freshness_status="stale"}
    values: 0+8x80
  alert_rule_test:
  - eval_time: 8m
    alertname: NetworkStateFreshnessLow
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: stream
        slo: network-state-freshness-share
      exp_annotations:
        summary: Fewer than 95% of computed network-state records are fresh.
        description: The state the operators see is being computed from stale inputs.
        action: Find which device types went silent (DevicesSilent) and whether ingestion is behind.
- interval: 15s
  input_series:
  - series: network_state_records_total{freshness_status="stale"}
    values: 0+10x80
  alert_rule_test:
  - eval_time: 8m
    alertname: NetworkStateFreshnessLow
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: stream
        slo: network-state-freshness-share
      exp_annotations:
        summary: Fewer than 95% of computed network-state records are fresh.
        description: The state the operators see is being computed from stale inputs.
        action: Find which device types went silent (DevicesSilent) and whether ingestion is behind.
- interval: 15s
  input_series:
  - series: network_state_records_total{freshness_status="fresh"}
    values: 0+20x80
  alert_rule_test:
  - eval_time: 8m
    alertname: NetworkStateFreshnessLow
    exp_alerts: []
- interval: 15s
  input_series:
  - series: api_http_requests_total{http_status_code="200"}
    values: 0+95x80
  - series: api_http_requests_total{http_status_code="500"}
    values: 0+5x80
  alert_rule_test:
  - eval_time: 8m
    alertname: ApiErrorRateHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: api
        slo: api-http-error-rate
      exp_annotations:
        summary: More than 1% of API requests are failing with a 5xx.
        description: The operator API is exceeding its error-rate SLO.
        action: Check the API log for the failing route, and dependency health (database, policy engine, identity provider).
- interval: 15s
  input_series:
  - series: api_http_requests_total{http_status_code="200"}
    values: 0+100x80
  alert_rule_test:
  - eval_time: 8m
    alertname: ApiErrorRateHigh
    exp_alerts: []
- interval: 15s
  input_series:
  - series: api_http_request_duration_milliseconds_bucket{le="1000"}
    values: 0+10x80
  - series: api_http_request_duration_milliseconds_bucket{le="2000"}
    values: 0+12x80
  - series: api_http_request_duration_milliseconds_bucket{le="5000"}
    values: 0+20x80
  - series: api_http_request_duration_milliseconds_bucket{le="+Inf"}
    values: 0+20x80
  alert_rule_test:
  - eval_time: 8m
    alertname: ApiLatencyP95High
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: api
        slo: api-http-latency-p95
      exp_annotations:
        summary: P95 API latency is above 2 s.
        description: The operator API is exceeding its latency SLO.
        action: Check database and policy-engine latency; look for a slow route.
- interval: 15s
  input_series:
  - series: api_http_request_duration_milliseconds_bucket{le="1000"}
    values: 0+20x80
  - series: api_http_request_duration_milliseconds_bucket{le="2000"}
    values: 0+20x80
  - series: api_http_request_duration_milliseconds_bucket{le="5000"}
    values: 0+20x80
  - series: api_http_request_duration_milliseconds_bucket{le="+Inf"}
    values: 0+20x80
  alert_rule_test:
  - eval_time: 8m
    alertname: ApiLatencyP95High
    exp_alerts: []
- interval: 15s
  input_series:
  - series: up{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: EdgeRuntimeDown
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: model
        job: edge-runtime
        instance: aiops-edge-runtime:9100
      exp_annotations:
        summary: The edge runtime's metrics endpoint is not answering.
        description: No edge inference is observable; the edge runtime may be down.
        action: Check the edge runtime container and its /healthz.
- interval: 15s
  input_series:
  - series: up{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 1x30
  alert_rule_test:
  - eval_time: 4m
    alertname: EdgeRuntimeDown
    exp_alerts: []
- interval: 15s
  input_series:
  - series: edge_model_active{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeModelInactive
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: model
        job: edge-runtime
        instance: aiops-edge-runtime:9100
      exp_annotations:
        summary: The edge runtime is serving the transparent baseline, not the ONNX model.
        description: The model failed to load or was disabled after errors; decisions are labelled baseline.
        action: Read edge_model_errors_total by code; roll back to the previous verified model version.
- interval: 15s
  input_series:
  - series: edge_model_active{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 1x30
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeModelInactive
    exp_alerts: []
- interval: 15s
  input_series:
  - series: edge_model_errors_total{code="integrity_mismatch",job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 0 1x30
  alert_rule_test:
  - eval_time: 2m
    alertname: EdgeModelErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: model
        code: integrity_mismatch
        job: edge-runtime
        instance: aiops-edge-runtime:9100
      exp_annotations:
        summary: The edge model reported integrity_mismatch errors.
        description: A model load or inference failure was counted in the last 5 minutes.
        action: 'Inspect the error code: integrity_mismatch and schema_mismatch mean a bad artifact, consecutive_errors means a runtime fault.'
- interval: 15s
  input_series:
  - series: edge_model_errors_total{code="integrity_mismatch",job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 1x30
  - series: edge_uptime_seconds{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 5+15x30
  alert_rule_test:
  - eval_time: 2m
    alertname: EdgeModelErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: model
        code: integrity_mismatch
        job: edge-runtime
        instance: aiops-edge-runtime:9100
      exp_annotations:
        summary: The edge model reported integrity_mismatch errors.
        description: A model load or inference failure was counted in the last 5 minutes.
        action: 'Inspect the error code: integrity_mismatch and schema_mismatch mean a bad artifact, consecutive_errors means a runtime fault.'
- interval: 15s
  input_series:
  - series: edge_model_errors_total{code="integrity_mismatch",job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 1x30
  - series: edge_uptime_seconds{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 100000x30
  alert_rule_test:
  - eval_time: 2m
    alertname: EdgeModelErrors
    exp_alerts: []
- interval: 15s
  input_series:
  - series: edge_model_errors_total{code="integrity_mismatch",job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 2m
    alertname: EdgeModelErrors
    exp_alerts: []
- interval: 15s
  input_series:
  - series: edge_model_inference_latency_ms_bucket{le="50"}
    values: '0x60'
  - series: edge_model_inference_latency_ms_bucket{le="100"}
    values: '0x60'
  - series: edge_model_inference_latency_ms_bucket{le="250"}
    values: 0+10x60
  - series: edge_model_inference_latency_ms_bucket{le="+Inf"}
    values: 0+10x60
  alert_rule_test:
  - eval_time: 5m
    alertname: EdgeModelLatencyP95High
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: model
        slo: edge-model-inference-latency-p95
      exp_annotations:
        summary: P95 edge model inference latency is above 100 ms.
        description: LAT-01 is being missed on the edge.
        action: Check edge CPU throttling and memory pressure.
- interval: 15s
  input_series:
  - series: edge_model_inference_latency_ms_bucket{le="50"}
    values: 0+10x60
  - series: edge_model_inference_latency_ms_bucket{le="100"}
    values: 0+10x60
  - series: edge_model_inference_latency_ms_bucket{le="250"}
    values: 0+10x60
  - series: edge_model_inference_latency_ms_bucket{le="+Inf"}
    values: 0+10x60
  alert_rule_test:
  - eval_time: 5m
    alertname: EdgeModelLatencyP95High
    exp_alerts: []
- interval: 15s
  input_series:
  - series: edge_pending_devices{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 80x30
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgePendingDevicesSaturated
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: model
        slo: edge-pending-devices-saturation
        job: edge-runtime
        instance: aiops-edge-runtime:9100
      exp_annotations:
        summary: More than 70 devices are waiting for edge evaluation.
        description: The edge runtime is falling behind its input.
        action: Check edge CPU limits; consider sampling (P10.08 policy-controlled action).
- interval: 15s
  input_series:
  - series: edge_pending_devices{job="edge-runtime",instance="aiops-edge-runtime:9100"}
    values: 10x30
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgePendingDevicesSaturated
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_database_size_bytes
    values: 9000000000x60
  - series: platform_database_size_limit_bytes
    values: 10000000000x60
  alert_rule_test:
  - eval_time: 7m
    alertname: DatabaseSizeNearLimit
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: storage
      exp_annotations:
        summary: The database is over 80% of its size budget.
        description: Retention switches to shorter windows at 100% (database/retention.py HARD_SIZE_BYTES).
        action: Run retention; review large tables before pressure mode starts deleting sooner.
- interval: 15s
  input_series:
  - series: platform_database_size_bytes
    values: 1000000000x60
  - series: platform_database_size_limit_bytes
    values: 10000000000x60
  alert_rule_test:
  - eval_time: 7m
    alertname: DatabaseSizeNearLimit
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_database_size_bytes
    values: 11000000000x60
  - series: platform_database_size_limit_bytes
    values: 10000000000x60
  alert_rule_test:
  - eval_time: 3m
    alertname: DatabaseSizeCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: storage
      exp_annotations:
        summary: The database has reached its size budget.
        description: Retention runs under storage pressure with shortened windows.
        action: Confirm retention ran; grow the volume or reduce ingest.
- interval: 15s
  input_series:
  - series: platform_database_size_bytes
    values: 9000000000x60
  - series: platform_database_size_limit_bytes
    values: 10000000000x60
  alert_rule_test:
  - eval_time: 3m
    alertname: DatabaseSizeCritical
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_retention_last_run_age_seconds
    values: 100000x60
  alert_rule_test:
  - eval_time: 7m
    alertname: RetentionOverdue
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: storage
      exp_annotations:
        summary: Retention has not run for over 26 hours.
        description: Retention is meant to run daily; data windows are not being enforced.
        action: Run database/retention.py and check its scheduler.
- interval: 15s
  input_series:
  - series: platform_retention_last_run_age_seconds
    values: 3600x60
  alert_rule_test:
  - eval_time: 7m
    alertname: RetentionOverdue
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_retention_storage_pressure
    values: 1x20
  alert_rule_test:
  - eval_time: 3m
    alertname: RetentionUnderStoragePressure
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: storage
      exp_annotations:
        summary: The last retention run happened under storage pressure.
        description: Windows were shortened because the database exceeded its budget.
        action: Investigate growth; data was deleted sooner than policy.
- interval: 15s
  input_series:
  - series: platform_retention_storage_pressure
    values: '0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: RetentionUnderStoragePressure
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_certificate_expiry_seconds{service_name="postgres"}
    values: 864000x20
  alert_rule_test:
  - eval_time: 3m
    alertname: CertificateExpiringSoon
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: cert
        service_name: postgres
      exp_annotations:
        summary: A postgres certificate expires in under 14 days.
        description: Rotate before expiry; an expired certificate stops device or database connections.
        action: Reissue the postgres certificates and reload the service.
- interval: 15s
  input_series:
  - series: platform_certificate_expiry_seconds{service_name="postgres"}
    values: 2000000x20
  alert_rule_test:
  - eval_time: 3m
    alertname: CertificateExpiringSoon
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_certificate_expiry_seconds{service_name="postgres"}
    values: 86400x20
  alert_rule_test:
  - eval_time: 3m
    alertname: CertificateExpiringSoon
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_certificate_expiry_seconds{service_name="postgres"}
    values: 86400x20
  alert_rule_test:
  - eval_time: 3m
    alertname: CertificateExpiryCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: cert
        service_name: postgres
      exp_annotations:
        summary: A postgres certificate expires in under 3 days, or has expired.
        description: Connections that rely on it will fail once it expires.
        action: Reissue immediately.
- interval: 15s
  input_series:
  - series: platform_certificate_expiry_seconds{service_name="mqtt-broker"}
    values: -100x20
  alert_rule_test:
  - eval_time: 3m
    alertname: CertificateExpiryCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: cert
        service_name: mqtt-broker
      exp_annotations:
        summary: A mqtt-broker certificate expires in under 3 days, or has expired.
        description: Connections that rely on it will fail once it expires.
        action: Reissue immediately.
- interval: 15s
  input_series:
  - series: platform_certificate_expiry_seconds{service_name="postgres"}
    values: 864000x20
  alert_rule_test:
  - eval_time: 3m
    alertname: CertificateExpiryCritical
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_device_certificate_expiry_seconds{device_type="traffic_loop"}
    values: 432000x20
  alert_rule_test:
  - eval_time: 3m
    alertname: DeviceCertificateExpiring
    exp_alerts:
    - exp_labels:
        severity: warning
        alert_class: cert
        device_type: traffic_loop
      exp_annotations:
        summary: A traffic_loop device certificate expires in under 14 days, or has expired.
        description: Taken from the device registry (devices.certificate_not_after).
        action: Renew the device certificate (CTL-39 lifecycle).
- interval: 15s
  input_series:
  - series: platform_device_certificate_expiry_seconds{device_type="traffic_loop"}
    values: 2000000x20
  alert_rule_test:
  - eval_time: 3m
    alertname: DeviceCertificateExpiring
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_config_policy_version_match
    values: '0x20'
  - series: platform_probe_target_up{service_name="opa"}
    values: 1x20
  alert_rule_test:
  - eval_time: 3m
    alertname: PolicyVersionDrift
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: config
      exp_annotations:
        summary: The policy engine is serving a different policy version than the repository generated.
        description: Decisions may use stale roles or routes.
        action: Run policy/build_data.py and restart the policy engine so it loads the current bundle.
- interval: 15s
  input_series:
  - series: platform_config_policy_version_match
    values: '0x20'
  - series: platform_probe_target_up{service_name="opa"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: PolicyVersionDrift
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_config_policy_version_match
    values: 1x20
  - series: platform_probe_target_up{service_name="opa"}
    values: 1x20
  alert_rule_test:
  - eval_time: 3m
    alertname: PolicyVersionDrift
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_config_migrations_pending
    values: '0x20'
  - series: platform_config_migrations_checksum_mismatch
    values: 1x20
  alert_rule_test:
  - eval_time: 3m
    alertname: MigrationDrift
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: config
      exp_annotations:
        summary: The database schema does not match the migration files.
        description: Pending migrations, or an applied migration whose file has since changed.
        action: Apply pending migrations; never edit an applied one (add a new migration).
- interval: 15s
  input_series:
  - series: platform_config_migrations_pending
    values: 2x20
  - series: platform_config_migrations_checksum_mismatch
    values: '0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: MigrationDrift
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: config
      exp_annotations:
        summary: The database schema does not match the migration files.
        description: Pending migrations, or an applied migration whose file has since changed.
        action: Apply pending migrations; never edit an applied one (add a new migration).
- interval: 15s
  input_series:
  - series: platform_config_migrations_pending
    values: '0x20'
  - series: platform_config_migrations_checksum_mismatch
    values: '0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: MigrationDrift
    exp_alerts: []
- interval: 15s
  input_series:
  - series: platform_config_api_auth_mode_oidc
    values: '0x20'
  alert_rule_test:
  - eval_time: 2m
    alertname: ApiAuthenticationNotEnforced
    exp_alerts:
    - exp_labels:
        severity: critical
        alert_class: config
      exp_annotations:
        summary: The API reports it is not enforcing OIDC authentication.
        description: AIOPS_AUTH_MODE=off exists only for data-verification scripts and must never run a served API.
        action: Restart the API with authentication on.
- interval: 15s
  input_series:
  - series: platform_config_api_auth_mode_oidc
    values: 1x20
  alert_rule_test:
  - eval_time: 2m
    alertname: ApiAuthenticationNotEnforced
    exp_alerts: []
