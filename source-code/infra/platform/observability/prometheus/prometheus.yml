# P10.03: local Prometheus. Backend services (api/gateway/ingestion/
# scenario-control) have no long-running container yet (P11.01), so there
# is nothing at a fixed address to scrape - they PUSH via OTLP instead
# (backend/observability.py already supports OTEL_EXPORTER_OTLP_ENDPOINT;
# Prometheus's own OTLP receiver, enabled by --web.enable-otlp-receiver on
# the container command, is the ingestion point). The edge runtime is the
# one component that serves its own /metrics (edge/health.py), so it is
# scraped (P10.04); the platform probe pushes its gauges like the backend.
# Alert rules (P10.04) live in rules/ and are tested with promtool
# (rule-tests/), see backend/aiops/verify_alerts.py.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  # The edge runtime container joins aiops-platform-net under this name. Until one is running the target is down, and
  # EdgeRuntimeDown says so (a service that is expected but absent is an alert, not silence).
  - job_name: edge-runtime
    metrics_path: /metrics
    static_configs:
      - targets: ["aiops-edge-runtime:9100"]
