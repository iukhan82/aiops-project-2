# P10.04: operational alert rules. Every threshold that has an SLO uses that SLO's target (backend/slos.json,
# cross-checked by backend/aiops/verify_alerts.py); every metric name is one the code really emits, in the form
# Prometheus really stores it (verify_observability_stack.py confirmed: counters end _total, a `ms` histogram is
# _milliseconds_*). Labels: alert_class is one of device|stream|api|model|storage|cert|config|pipeline; severity is
# warning|critical. `action` names what a person (and later the P10.08 remediation workers, only through policy) would
# do - it is guidance, not an automatic step.

groups:
  - name: aiops-pipeline
    rules:
      - alert: AlertPipelineWatchdog
        expr: vector(1)
        labels: {severity: none, alert_class: pipeline}
        annotations:
          summary: "Dead-man's switch: this alert must always be firing."
          description: "If this stops firing, rule evaluation or alert delivery is broken and no other alert can be trusted."
          action: "Check Prometheus rule evaluation and the alert receiver."

      - alert: PlatformProbeStale
        expr: time() - platform_probe_success_timestamp_seconds > 90
        for: 1m
        labels: {severity: critical, alert_class: pipeline}
        annotations:
          summary: "The platform probe has not reported for over 90 s."
          description: "Device, storage, certificate and configuration alerts read the probe's gauges; while it is silent they are blind."
          action: "Restart aiops-platform-probe; check its database and OTLP connectivity."

      - alert: PlatformProbeMissing
        expr: absent(platform_probe_success_timestamp_seconds)
        for: 5m
        labels: {severity: critical, alert_class: pipeline}
        annotations:
          summary: "No platform probe has ever reported (or its series expired)."
          description: "Without the probe the device, storage, certificate and configuration alerts cannot fire."
          action: "Start the platform probe."

      - alert: PlatformTargetDown
        expr: platform_probe_target_up == 0
        for: 1m
        labels: {severity: critical, alert_class: pipeline}
        annotations:
          summary: "{{ $labels.service_name }} did not answer the platform probe."
          description: "The probe could not read {{ $labels.service_name }} (database, policy engine or API)."
          action: "Check the {{ $labels.service_name }} container and its health endpoint."

  - name: aiops-device
    rules:
      - alert: DevicesSilent
        expr: |
          (sum by (device_type) (platform_devices_stale) + sum by (device_type) (platform_devices_never_reported))
            / clamp_min(sum by (device_type) (platform_devices_active), 1) > 0.25
        for: 2m
        labels: {severity: warning, alert_class: device}
        annotations:
          summary: "Over 25% of {{ $labels.device_type }} devices are stale or have never reported."
          description: "Staleness uses the same per-type budgets as the device-health screen (routes_govern.DEVICE_STALE_AFTER_S)."
          action: "Open Device health; check the gateway and the device's power/network."

      - alert: DeviceTypeOutage
        expr: |
          (sum by (device_type) (platform_devices_stale) + sum by (device_type) (platform_devices_never_reported))
            / clamp_min(sum by (device_type) (platform_devices_active), 1) >= 0.5
        for: 2m
        labels: {severity: critical, alert_class: device}
        annotations:
          summary: "Half or more of {{ $labels.device_type }} devices are silent."
          description: "A whole device class has stopped reporting; detectors that depend on it are blind."
          action: "Treat as a stream or site outage; escalate to the on-call owner."

  - name: aiops-stream
    rules:
      - alert: GatewayDeliveryStalled
        expr: |
          increase(gateway_events_received_total[5m]) > 20
            and increase(gateway_events_delivered_total[5m]) / increase(gateway_events_received_total[5m]) < 0.5
        for: 2m
        labels: {severity: critical, alert_class: stream}
        annotations:
          summary: "The gateway is receiving events but delivering under half of them."
          description: "MQTT-to-Kafka delivery has stalled; the durable outbox is buffering."
          action: "Check Kafka broker health and the gateway's outbox depth."

      - alert: IngestionRejectionRateHigh
        # SLO ingestion-rejection-rate: 5 percent over 5 minutes. Each term is `or vector(0)`: a counter that has
        # not been emitted yet (no duplicate replays, say) must count as zero, not empty the whole expression.
        expr: |
          100 * (
              (sum(rate(ingestion_events_rejected_schema_total[5m])) or vector(0))
            + (sum(rate(ingestion_events_rejected_unknown_device_total[5m])) or vector(0))
            + (sum(rate(ingestion_events_rejected_content_conflict_total[5m])) or vector(0))
          ) / clamp_min(
              (sum(rate(ingestion_events_inserted_total[5m])) or vector(0))
            + (sum(rate(ingestion_events_duplicate_ok_total[5m])) or vector(0))
            + (sum(rate(ingestion_events_rejected_schema_total[5m])) or vector(0))
            + (sum(rate(ingestion_events_rejected_unknown_device_total[5m])) or vector(0))
            + (sum(rate(ingestion_events_rejected_content_conflict_total[5m])) or vector(0)),
            0.000001) > 5
        for: 2m
        labels: {severity: warning, alert_class: stream, slo: ingestion-rejection-rate}
        annotations:
          summary: "More than 5% of ingested events are being rejected."
          description: "Schema, unknown-device or content-conflict rejections exceed the ingestion-rejection-rate SLO."
          action: "Read the ingestion rejection audit for the dominant reason (schema drift, unregistered device, replay conflict)."

      - alert: IngestionLatencyP95High
        # SLO ingestion-ingest-latency-p95: 2000 ms over 5 minutes.
        expr: histogram_quantile(0.95, sum by (le) (rate(ingestion_ingest_latency_milliseconds_bucket[5m]))) > 2000
        for: 2m
        labels: {severity: warning, alert_class: stream, slo: ingestion-ingest-latency-p95}
        annotations:
          summary: "P95 observation-to-database latency is above 2 s."
          description: "LAT-02 is being missed."
          action: "Check consumer lag and Postgres write latency."

      - alert: NetworkStateFreshnessLow
        # SLO network-state-freshness-share: 95 percent over 5 minutes.
        expr: |
          100 * (sum(rate(network_state_records_total{freshness_status="fresh"}[5m])) or vector(0))
            / clamp_min(sum(rate(network_state_records_total[5m])), 0.000001) < 95
            and sum(rate(network_state_records_total[5m])) > 0
        for: 2m
        labels: {severity: warning, alert_class: stream, slo: network-state-freshness-share}
        annotations:
          summary: "Fewer than 95% of computed network-state records are fresh."
          description: "The state the operators see is being computed from stale inputs."
          action: "Find which device types went silent (DevicesSilent) and whether ingestion is behind."

  - name: aiops-api
    rules:
      - alert: ApiErrorRateHigh
        # SLO api-http-error-rate: 1 percent over 5 minutes.
        expr: |
          100 * sum(rate(api_http_requests_total{http_status_code=~"5.."}[5m])) / clamp_min(sum(rate(api_http_requests_total[5m])), 0.000001) > 1
            and sum(rate(api_http_requests_total[5m])) > 0
        for: 2m
        labels: {severity: warning, alert_class: api, slo: api-http-error-rate}
        annotations:
          summary: "More than 1% of API requests are failing with a 5xx."
          description: "The operator API is exceeding its error-rate SLO."
          action: "Check the API log for the failing route, and dependency health (database, policy engine, identity provider)."

      - alert: ApiLatencyP95High
        # SLO api-http-latency-p95: 2000 ms over 5 minutes.
        expr: histogram_quantile(0.95, sum by (le) (rate(api_http_request_duration_milliseconds_bucket[5m]))) > 2000
        for: 2m
        labels: {severity: warning, alert_class: api, slo: api-http-latency-p95}
        annotations:
          summary: "P95 API latency is above 2 s."
          description: "The operator API is exceeding its latency SLO."
          action: "Check database and policy-engine latency; look for a slow route."

  - name: aiops-model
    rules:
      - alert: EdgeRuntimeDown
        expr: up{job="edge-runtime"} == 0
        for: 2m
        labels: {severity: critical, alert_class: model}
        annotations:
          summary: "The edge runtime's metrics endpoint is not answering."
          description: "No edge inference is observable; the edge runtime may be down."
          action: "Check the edge runtime container and its /healthz."

      - alert: EdgeModelInactive
        expr: edge_model_active == 0
        for: 1m
        labels: {severity: warning, alert_class: model}
        annotations:
          summary: "The edge runtime is serving the transparent baseline, not the ONNX model."
          description: "The model failed to load or was disabled after errors; decisions are labelled baseline."
          action: "Read edge_model_errors_total by code; roll back to the previous verified model version."

      - alert: EdgeModelErrors
        # `increase()` alone misses a model that fails while the runtime starts: the counter is already 1 at the first
        # scrape, so it never "increases". An error counted by a process younger than 5 minutes is therefore counted too.
        expr: |
          increase(edge_model_errors_total[5m]) > 0
            or (edge_model_errors_total > 0 and on (job, instance) (edge_uptime_seconds < 300))
        for: 0m
        labels: {severity: warning, alert_class: model}
        annotations:
          summary: "The edge model reported {{ $labels.code }} errors."
          description: "A model load or inference failure was counted in the last 5 minutes."
          action: "Inspect the error code: integrity_mismatch and schema_mismatch mean a bad artifact, consecutive_errors means a runtime fault."

      - alert: EdgeModelLatencyP95High
        # SLO edge-model-inference-latency-p95: 100 ms over 1 minute.
        expr: histogram_quantile(0.95, sum by (le) (rate(edge_model_inference_latency_ms_bucket[1m]))) > 100
        for: 1m
        labels: {severity: warning, alert_class: model, slo: edge-model-inference-latency-p95}
        annotations:
          summary: "P95 edge model inference latency is above 100 ms."
          description: "LAT-01 is being missed on the edge."
          action: "Check edge CPU throttling and memory pressure."

      - alert: EdgePendingDevicesSaturated
        # SLO edge-pending-devices-saturation: 70 devices.
        expr: max_over_time(edge_pending_devices[1m]) > 70
        for: 1m
        labels: {severity: warning, alert_class: model, slo: edge-pending-devices-saturation}
        annotations:
          summary: "More than 70 devices are waiting for edge evaluation."
          description: "The edge runtime is falling behind its input."
          action: "Check edge CPU limits; consider sampling (P10.08 policy-controlled action)."

  - name: aiops-storage
    rules:
      - alert: DatabaseSizeNearLimit
        expr: platform_database_size_bytes / platform_database_size_limit_bytes > 0.8
        for: 5m
        labels: {severity: warning, alert_class: storage}
        annotations:
          summary: "The database is over 80% of its size budget."
          description: "Retention switches to shorter windows at 100% (database/retention.py HARD_SIZE_BYTES)."
          action: "Run retention; review large tables before pressure mode starts deleting sooner."

      - alert: DatabaseSizeCritical
        expr: platform_database_size_bytes / platform_database_size_limit_bytes >= 1
        for: 1m
        labels: {severity: critical, alert_class: storage}
        annotations:
          summary: "The database has reached its size budget."
          description: "Retention runs under storage pressure with shortened windows."
          action: "Confirm retention ran; grow the volume or reduce ingest."

      - alert: RetentionOverdue
        expr: platform_retention_last_run_age_seconds > 26 * 3600
        for: 5m
        labels: {severity: warning, alert_class: storage}
        annotations:
          summary: "Retention has not run for over 26 hours."
          description: "Retention is meant to run daily; data windows are not being enforced."
          action: "Run database/retention.py and check its scheduler."

      - alert: RetentionUnderStoragePressure
        expr: platform_retention_storage_pressure == 1
        for: 1m
        labels: {severity: critical, alert_class: storage}
        annotations:
          summary: "The last retention run happened under storage pressure."
          description: "Windows were shortened because the database exceeded its budget."
          action: "Investigate growth; data was deleted sooner than policy."

  - name: aiops-cert
    rules:
      - alert: CertificateExpiringSoon
        expr: platform_certificate_expiry_seconds < 14 * 86400 and platform_certificate_expiry_seconds >= 3 * 86400
        for: 1m
        labels: {severity: warning, alert_class: cert}
        annotations:
          summary: "A {{ $labels.service_name }} certificate expires in under 14 days."
          description: "Rotate before expiry; an expired certificate stops device or database connections."
          action: "Reissue the {{ $labels.service_name }} certificates and reload the service."

      - alert: CertificateExpiryCritical
        expr: platform_certificate_expiry_seconds < 3 * 86400
        for: 1m
        labels: {severity: critical, alert_class: cert}
        annotations:
          summary: "A {{ $labels.service_name }} certificate expires in under 3 days, or has expired."
          description: "Connections that rely on it will fail once it expires."
          action: "Reissue immediately."

      - alert: DeviceCertificateExpiring
        expr: platform_device_certificate_expiry_seconds < 14 * 86400
        for: 1m
        labels: {severity: warning, alert_class: cert}
        annotations:
          summary: "A {{ $labels.device_type }} device certificate expires in under 14 days, or has expired."
          description: "Taken from the device registry (devices.certificate_not_after)."
          action: "Renew the device certificate (CTL-39 lifecycle)."

  - name: aiops-config
    rules:
      - alert: PolicyVersionDrift
        expr: platform_config_policy_version_match == 0 and on() platform_probe_target_up{service_name="opa"} == 1
        for: 1m
        labels: {severity: critical, alert_class: config}
        annotations:
          summary: "The policy engine is serving a different policy version than the repository generated."
          description: "Decisions may use stale roles or routes."
          action: "Run policy/build_data.py and restart the policy engine so it loads the current bundle."

      - alert: MigrationDrift
        expr: platform_config_migrations_pending > 0 or platform_config_migrations_checksum_mismatch > 0
        for: 1m
        labels: {severity: critical, alert_class: config}
        annotations:
          summary: "The database schema does not match the migration files."
          description: "Pending migrations, or an applied migration whose file has since changed."
          action: "Apply pending migrations; never edit an applied one (add a new migration)."

      - alert: ApiAuthenticationNotEnforced
        expr: platform_config_api_auth_mode_oidc == 0
        for: 30s
        labels: {severity: critical, alert_class: config}
        annotations:
          summary: "The API reports it is not enforcing OIDC authentication."
          description: "AIOPS_AUTH_MODE=off exists only for data-verification scripts and must never run a served API."
          action: "Restart the API with authentication on."
