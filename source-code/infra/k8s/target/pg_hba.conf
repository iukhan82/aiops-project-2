# P11.03/P11.04: PostgreSQL client authentication for the cluster - TLS or nothing.
#
# The official image's default pg_hba.conf accepts a plain (non-TLS) TCP connection as readily as a TLS one. Server-side `ssl=on` only OFFERS
# encryption; a client that asks for none gets none. This file makes the database refuse a connection that is not TLS, and a password over
# TLS the only way in. The local socket inside the pod stays as the image sets it (only the container's own processes can reach it: the
# readiness of the database itself and the `psql` used at deployment to give each service role its password).
local   all   all                     trust
hostnossl all all 0.0.0.0/0           reject
hostnossl all all ::/0                reject
hostssl   all all 0.0.0.0/0           scram-sha-256
hostssl   all all ::/0                scram-sha-256
