# P11.03: the cluster's MQTT broker configuration - the mutually-authenticated listener ONLY.
#
# The compose stack's mosquitto.conf keeps a second, plain and anonymous listener on 1883 as the isolated dev fixture ADR-0002 carves out; nothing
# beyond that fixture may use it, so the cluster does not have it at all (the native negative check of P11.04 is that port 1883 is closed).
#
# There is exactly one listener, so this file does NOT set `per_listener_settings true`, and that is deliberate. Measured on the target (and again on a bare
# broker, mosquitto 2.0.18): with per_listener_settings true the broker keeps NO offline queue for a persistent session - a client that reconnects gets
# nothing that was published while it was away, although every publisher was acknowledged. The gateway depends on that queue to lose nothing across its own
# restart. Without the option the authentication and ACL settings below are global, which for a single listener is the same thing.
allow_anonymous false
acl_file /mosquitto/config/acl.conf

# The gateway holds a PERSISTENT session with manual acknowledgements (backend/gateway/gateway.py): while it is away the broker queues what it
# would have delivered, and while it is busy the broker may have this many unacknowledged messages in flight to it. The defaults (20 in flight,
# 1000 queued) would throttle a busy gateway and silently drop an outage's worth of events beyond a thousand.
max_inflight_messages 500
max_queued_messages 100000

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice

# Every device presents a client certificate signed by the platform CA; its CN becomes the MQTT username (use_identity_as_username), which
# acl.conf's `devices/%u/#` pattern scopes to that device's own topics. A client the CA did not sign fails the TLS handshake before any MQTT
# CONNECT is possible.
listener 8883
protocol mqtt
require_certificate true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
use_identity_as_username true
