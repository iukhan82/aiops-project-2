apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-api
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-api
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    aiops/note: operator API
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-api
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: aiops-backend:0.1.0
        imagePullPolicy: IfNotPresent
        args:
        - backend/api/serve.py
        - --host
        - 0.0.0.0
        - --port
        - '8100'
        - --database
        - aiops
        ports:
        - name: http
          containerPort: 8100
        env:
        - name: POSTGRES_HOST
          value: aiops-postgres
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: aiops
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: postgres-password
        - name: OPA_URL
          value: http://aiops-opa:8181
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://aiops-tempo:4318/v1/traces
        - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
          value: http://aiops-prometheus:9090/api/v1/otlp/v1/metrics
        - name: KEYCLOAK_ISSUER
          value: http://aiops-keycloak:8080/realms/aiops
        - name: KEYCLOAK_AUDIENCE
          value: aiops-api
        - name: KEYCLOAK_JWKS_URL
          value: http://aiops-keycloak:8080/realms/aiops/protocol/openid-connect/certs
        - name: AIOPS_AUTH_MODE
          value: oidc
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 125m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet: &id001
            path: /api/v1/health
            port: 8100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

