      serviceAccountName: aiops-kafka-broker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka-broker
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.18@sha256:0270951e8793c77f0dd9178d137198018fa7ffd920e5a2a3b02a050ec76195b8
        imagePullPolicy: IfNotPresent
        args:
        - redpanda
        - start
        - --mode
        - dev-container
        - --smp
        - '1'
        - --memory
        - 800M
        - --reserve-memory
        - 0M
        - --node-id
        - '0'
        - --check=false
        - --kafka-addr
        - internal://0.0.0.0:9092
        - --advertise-kafka-addr
        - internal://aiops-kafka-broker:9092
        - --rpc-addr
        - 127.0.0.1:33145
        - --advertise-rpc-addr
        - 127.0.0.1:33145
        ports:
        - name: kafka
          containerPort: 9092
        - name: admin
          containerPort: 9644
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 375m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1024Mi
        readinessProbe:
          httpGet: &id001
            path: /v1/status/ready
            port: 9644
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: tmp1
          mountPath: /etc/redpanda
        - name: data
          mountPath: /var/lib/redpanda/data
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: tmp1
        emptyDir:
          sizeLimit: 64Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

