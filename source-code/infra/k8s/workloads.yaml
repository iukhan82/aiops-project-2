apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-mqtt-gateway
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-mqtt-gateway
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    aiops/note: 'MQTT-to-Kafka gateway: the only client that reads every device''s telemetry (its own certificate, CN gateway); a durable outbox
      between the two'
spec:
  replicas: 1
  serviceName: aiops-mqtt-gateway
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-mqtt-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-mqtt-gateway
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-mqtt-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mqtt-gateway
        image: aiops-backend:0.1.0
        imagePullPolicy: IfNotPresent
        args:
        - backend/gateway/serve.py
        env:
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://aiops-tempo:4318/v1/traces
        - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
          value: http://aiops-prometheus:9090/api/v1/otlp/v1/metrics
        - name: MQTT_HOST
          value: aiops-mqtt-broker
        - name: MQTT_PORT
          value: '8883'
        - name: MQTT_CAFILE
          value: /certs/ca.crt
        - name: MQTT_CERTFILE
          value: /certs/tls.crt
        - name: MQTT_KEYFILE
          value: /certs/tls.key
        - name: KAFKA_BOOTSTRAP
          value: aiops-kafka-broker:9092
        - name: GATEWAY_OUTBOX
          value: /data/outbox.sqlite3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 125m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: tls
          mountPath: /certs
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: tls
        secret:
          secretName: aiops-tls-gateway
          defaultMode: 288
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

