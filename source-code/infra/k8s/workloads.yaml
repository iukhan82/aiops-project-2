apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-keycloak
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-keycloak
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    aiops/note: 'identity provider in start-dev mode (embedded H2 database) as in the compose stack: NOT a production Keycloak'
spec:
  replicas: 1
  serviceName: aiops-keycloak
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-keycloak
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: seed-quarkus
        image: quay.io/keycloak/keycloak:26.0.8@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - cp -R /opt/keycloak/lib/quarkus/. /seed/
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: quarkus
          mountPath: /seed
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.8@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
        imagePullPolicy: IfNotPresent
        args:
        - start-dev
        - --import-realm
        - --http-enabled=true
        - --hostname-strict=false
        - --health-enabled=true
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: keycloak-admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: keycloak-admin-password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        readinessProbe:
          httpGet: &id001
            path: /health/ready
            port: 9000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: quarkus
          mountPath: /opt/keycloak/lib/quarkus
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        - name: data
          mountPath: /opt/keycloak/data
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: quarkus
        emptyDir:
          sizeLimit: 512Mi
      - name: realm
        configMap:
          name: aiops-realm
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

