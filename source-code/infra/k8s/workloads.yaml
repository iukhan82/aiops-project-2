apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-edge-runtime
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-edge-runtime
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    aiops/note: one edge site replaying a recorded ten-minute run at one hundredth of real time, serving its health and /metrics; its outbox has
      no drain to MQTT in this repository yet (backend/topology.json says so)
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-edge-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-edge-runtime
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-edge-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: edge-runtime
        image: aiops-edge:0.1.0
        imagePullPolicy: IfNotPresent
        args:
        - replay
        - --config
        - /site/config.json
        - --events
        - /site/events.jsonl
        - --pace
        - '0.01'
        - --health-host
        - 0.0.0.0
        - --health-port
        - '9100'
        ports:
        - name: metrics
          containerPort: 9100
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        readinessProbe:
          httpGet: &id001
            path: /readyz
            port: 9100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: site
          mountPath: /site
          readOnly: true
        - name: model
          mountPath: /model
          readOnly: true
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: site
        configMap:
          name: aiops-edge-site
      - name: model
        configMap:
          name: aiops-edge-model
  strategy:
    type: Recreate

