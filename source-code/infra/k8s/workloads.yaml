apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-postgres
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-postgres
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    aiops/note: PostGIS, TLS only (pg_hba refuses a plain connection); server.crt, server.key and ca.crt come from the aiops-tls-postgres Secret
spec:
  replicas: 1
  serviceName: aiops-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-postgres
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/certs/server.crt
        - -c
        - ssl_key_file=/certs/server.key
        - -c
        - ssl_ca_file=/certs/ca.crt
        - -c
        - hba_file=/etc/postgres-hba/pg_hba.conf
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: aiops
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 375m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1024Mi
        readinessProbe:
          tcpSocket: &id001
            port: 5432
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket: *id001
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: tmp1
          mountPath: /var/run/postgresql
        - name: tls
          mountPath: /certs
          readOnly: true
        - name: hba
          mountPath: /etc/postgres-hba
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: tmp1
        emptyDir:
          sizeLimit: 64Mi
      - name: tls
        secret:
          secretName: aiops-tls-postgres
          defaultMode: 288
      - name: hba
        configMap:
          name: aiops-postgres-hba
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

