apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiops-grafana
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-grafana
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    aiops/note: dashboards; no anonymous access, no sign-up
spec:
  replicas: 1
  serviceName: aiops-grafana
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-grafana
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:12.2.1@sha256:35c41e0fd0295f5d0ee5db7e780cf33506abfaf47686196f825364889dee878b
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: grafana-admin-password
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        readinessProbe:
          httpGet: &id001
            path: /api/health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: provisioning
          mountPath: /etc/grafana/provisioning
          readOnly: true
        - name: dashboards
          mountPath: /etc/grafana/dashboards
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: provisioning
        configMap:
          name: aiops-grafana-provisioning
          items:
          - key: datasources__datasources.yaml
            path: datasources/datasources.yaml
          - key: dashboards__dashboards.yaml
            path: dashboards/dashboards.yaml
      - name: dashboards
        configMap:
          name: aiops-grafana-dashboards
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

