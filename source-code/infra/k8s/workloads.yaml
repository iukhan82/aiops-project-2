    aiops/note: 'metrics, OTLP receiver and the P10.04 alert rules (ConfigMap aiops-prometheus: prometheus.yml and rules/)'
spec:
  replicas: 1
  serviceName: aiops-prometheus
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-prometheus
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-prometheus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        - --web.enable-otlp-receiver
        ports:
        - name: http
          containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 200m
            memory: 384Mi
        readinessProbe:
          httpGet: &id001
            path: /-/ready
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp0
          mountPath: /tmp
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
      volumes:
      - name: tmp0
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: aiops-prometheus
          items:
          - key: prometheus.yml
            path: prometheus.yml
          - key: rules__aiops-alerts.yml
            path: rules/aiops-alerts.yml
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

