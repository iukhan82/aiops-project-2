      labels:
        app.kubernetes.io/name: aiops-migrate
        app.kubernetes.io/part-of: aiops-platform
    spec:
      serviceAccountName: aiops-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: aiops-backend:0.1.0
        imagePullPolicy: IfNotPresent
        args:
        - database/migrate.py
        env:
        - name: POSTGRES_HOST
          value: aiops-postgres
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: aiops
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: postgres-password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
