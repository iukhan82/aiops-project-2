# P11.01: server block for the console image (nginx-unprivileged listens on 8080 as uid 101).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing may frame the console, and it may connect only to itself and the identity provider (see security-headers.conf).
    include /etc/nginx/security-headers.conf;

    # Hashed build assets never change; the shell page must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # One origin for the browser: the operator API (REST and WebSocket) and the demo scenario-control API are reached through it.
    location /api/ {
        proxy_pass http://aiops-api:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /scenario-control/ {
        proxy_pass http://aiops-scenario-control:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
