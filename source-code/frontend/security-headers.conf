# P11.01: response security headers, included at server level AND in every location that sets its own add_header
# (nginx drops inherited add_header directives in a location that defines any).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' __KEYCLOAK_ORIGIN__ ws: wss:; frame-src __KEYCLOAK_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
