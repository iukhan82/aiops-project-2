name: project-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-code/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r source-code/requirements-lock.txt
      - run: python source-code/scripts/check.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source-code/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source-code/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  sonarqube:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [python, frontend]
    # SONAR_TOKEN lives in the "Docker" environment's secrets, not repo-level
    # secrets - a job only sees an environment's secrets when it declares
    # that environment here.
    environment: Docker
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  repository-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan dependencies, configuration and secrets
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          aquasec/trivy:0.74.0
          filesystem
          --scanners vuln,misconfig,secret
          --exit-code 1
          --severity CRITICAL,HIGH
          --skip-dirs /workspace/.git
          --skip-dirs /workspace/.venv
          --skip-dirs /workspace/source-code/frontend/.venv
          --skip-dirs /workspace/source-code/frontend/node_modules
          /workspace

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN live in the "Docker" environment's
    # secrets, not repo-level secrets - see the sonarqube job's comment above.
    environment: Docker
    env:
      DOCKERHUB_IMAGE: iukhan82/aiops-edge
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-code/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r source-code/requirements-lock.txt
      - name: Build, scan, SBOM, sign and admission-gate the edge release image (P09.08)
        run: python3 source-code/security/supply_chain/build_release.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            docs/evidence/p09_08_supply_chain.json
            source-code/security/supply_chain/output/
      # Only pushes on main - the admission gate above already proved the
      # image is signed and passes; a PR build has no business landing on
      # Docker Hub before it's merged.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push edge image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LOCAL_TAG=$(python3 -c "import json; print(json.load(open('docs/evidence/p09_08_supply_chain.json'))['metrics']['image']['tag'])")
          docker tag "$LOCAL_TAG" "$DOCKERHUB_IMAGE:${{ github.sha }}"
          docker tag "$LOCAL_TAG" "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:${{ github.sha }}"
          docker push "$DOCKERHUB_IMAGE:latest"
